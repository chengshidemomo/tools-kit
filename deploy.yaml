---
apiVersion: v1
kind: Namespace
metadata:
  name: dev-tools
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dev-tools-web
  namespace: dev-tools
  labels:
    app: dev-tools-web
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: dev-tools-web
  template:
    metadata:
      labels:
        app: dev-tools-web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
      containers:
        - name: web
          # Replace with your registry image, e.g. ghcr.io/your-org/dev-tools:latest
          image: dev-tools-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: dev-tools-web
  namespace: dev-tools
  labels:
    app: dev-tools-web
spec:
  type: ClusterIP
  selector:
    app: dev-tools-web
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dev-tools-web
  namespace: dev-tools
  annotations:
    # Adjust to match your ingress controller (nginx / traefik / etc.)
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: tools.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dev-tools-web
                port:
                  number: 80
  tls:
    - hosts:
        - tools.example.com
      secretName: dev-tools-web-tls
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: dev-tools-web
  namespace: dev-tools
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: dev-tools-web
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
